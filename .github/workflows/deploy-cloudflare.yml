name: Deploy OpenBoard

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      VITE_CLERK_ENABLED: 'true'
      VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
      VITE_WHITEBOARD_API_URL: ${{ vars.VITE_WHITEBOARD_API_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - name: Check production configuration
        run: |
          test -n "$VITE_CLERK_PUBLISHABLE_KEY" || { echo 'Missing VITE_CLERK_PUBLISHABLE_KEY'; exit 1; }
          test -n "$VITE_WHITEBOARD_API_URL" || { echo 'Missing VITE_WHITEBOARD_API_URL'; exit 1; }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=openboard
